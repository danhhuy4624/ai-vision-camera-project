syntax = "proto3";

package detection;

option go_package = "./pb";

message BoundingBox {
    string class_name = 1;
    float confidence = 2;
    float x_min = 3;
    float y_min = 4;
    float x_max = 5;
    float y_max = 6;
}

message FrameData {
    int64 timestamp = 1;
    repeated BoundingBox detections = 2;
    bytes image_data = 3; // Make sure this line exists and file is saved (Ctrl + S)
}

message Response {
    bool success = 1;
    string message = 2;
}

service DetectionService {
    rpc SendFrame (FrameData) returns (Response);
}