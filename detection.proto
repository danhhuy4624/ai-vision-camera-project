syntax = "proto3";

package detection;

// Defines where the generated Go code will live
option go_package = "./pb";

// A single detected object
message BoundingBox {
    string class_name = 1;
    float confidence = 2;
    float x_min = 3;
    float y_min = 4;
    float x_max = 5;
    float y_max = 6;
}

// All detections within a single video frame
message FrameData {
    int64 timestamp = 1;
    repeated BoundingBox detections = 2;
}

message Response {
    bool success = 1;
    string message = 2;
}

// The service definition
service DetectionService {
    rpc SendFrame (FrameData) returns (Response);
}